<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="16" fill="#F1F5F9"/>
  <circle cx="200" cy="150" r="110" fill="#E2E8F0" opacity="0.6"/>

  <!-- 1/2-Inch Square Drive Anvil -->
  <rect x="75" y="105" width="28" height="24" rx="2" fill="#0F172A"/>
  <rect x="62" y="110" width="14" height="14" rx="2" fill="#334155" stroke="#0F172A" stroke-width="2"/>
  <circle cx="69" cy="117" r="2.5" fill="#CBD5E1"/> <!-- Friction ring pin -->

  <!-- Solid Cast Aluminum Nose Cone -->
  <path d="M102 96H155V138H102L95 125Z" fill="#94A3B8" stroke="#475569" stroke-width="2"/>
  <line x1="112" y1="98" x2="112" y2="136" stroke="#64748B" stroke-width="2"/>

  <!-- Heavy Brushless Motor Body -->
  <path d="M155 88H260C272 88 280 98 280 110V140C280 148 274 155 264 156L222 158V230H178V155H155V88Z" fill="#0F172A"/>

  <!-- Torque Badge / Accent -->
  <rect x="175" y="104" width="70" height="20" rx="4" fill="#EA580C"/>
  <text x="210" y="118" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">350 NM TORQUE</text>

  <!-- Handle & Variable Trigger -->
  <rect x="182" y="165" width="36" height="60" rx="6" fill="#334155"/>
  <path d="M170 160H178V182H172C168 182 166 176 166 170Z" fill="#EA580C"/>

  <!-- 20V Battery Base with Digital Speed Switch (Low/Med/High) -->
  <rect x="155" y="230" width="105" height="38" rx="7" fill="#1E293B" stroke="#0F172A" stroke-width="2"/>
  <rect x="160" y="246" width="30" height="14" rx="3" fill="#EA580C"/>
  <text x="175" y="256" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" text-anchor="middle">20V</text>
  <circle cx="210" cy="253" r="3" fill="#22C55E"/>
  <circle cx="222" cy="253" r="3" fill="#22C55E"/>
  <circle cx="234" cy="253" r="3" fill="#22C55E"/>

  <!-- Badge -->
  <rect x="25" y="25" width="125" height="24" rx="6" fill="#0F172A"/>
  <text x="87" y="41" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#EA580C" text-anchor="middle">BRUSHLESS 350NM</text>
</svg>
