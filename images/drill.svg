<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <rect width="400" height="300" rx="16" fill="#F1F5F9"/>
  <circle cx="200" cy="150" r="110" fill="#E2E8F0" opacity="0.6"/>

  <!-- Drill Bit & Chuck -->
  <polygon points="50,113 85,110 85,116" fill="#64748B"/>
  <line x1="50" y1="113" x2="85" y2="113" stroke="#0F172A" stroke-width="3"/>
  <rect x="85" y="100" width="35" height="26" rx="4" fill="#334155" stroke="#1E293B" stroke-width="2"/>
  <line x1="95" y1="100" x2="95" y2="126" stroke="#94A3B8" stroke-width="2"/>
  <line x1="105" y1="100" x2="105" y2="126" stroke="#94A3B8" stroke-width="2"/>
  <rect x="120" y="104" width="18" height="18" fill="#64748B"/>

  <!-- Gear Housing (Aluminum front) -->
  <path d="M138 92H185V136H138L130 120Z" fill="#94A3B8" stroke="#475569" stroke-width="2"/>
  <!-- Hammer Mode Selector Switch -->
  <rect x="155" y="82" width="16" height="10" rx="2" fill="#EA580C"/>

  <!-- Main Motor Body -->
  <path d="M185 85H270C282 85 292 95 292 107V140C292 150 285 158 275 160L235 162V240C235 248 228 255 220 255H195C187 255 180 248 180 240V160H185Z" fill="#0F172A"/>

  <!-- Ergonomic Grip Inlay -->
  <path d="M185 175C185 170 190 168 196 168H218C224 168 228 172 228 178V235C228 240 224 245 218 245H195C190 245 185 240 185 235Z" fill="#334155"/>
  <rect x="188" y="180" width="30" height="8" rx="2" fill="#EA580C"/>

  <!-- Trigger Switch & Reversing Lever -->
  <path d="M172 168H182V192H175C170 192 168 186 168 180C168 174 170 168 172 168Z" fill="#EA580C"/>
  <circle cx="178" cy="155" r="5" fill="#94A3B8"/> <!-- Reversing push pin -->

  <!-- Side Handle Mount -->
  <rect x="145" y="136" width="14" height="60" rx="4" fill="#1E293B"/>
  <rect x="140" y="185" width="24" height="35" rx="5" fill="#334155"/>

  <!-- Cooling vents -->
  <line x1="240" y1="100" x2="275" y2="100" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
  <line x1="240" y1="110" x2="275" y2="110" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
  <line x1="240" y1="120" x2="275" y2="120" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>

  <!-- Power Cord with anti-kink boot -->
  <path d="M208 255V270C208 276 214 282 220 282H260" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>

  <!-- Badge -->
  <rect x="25" y="25" width="90" height="24" rx="6" fill="#0F172A"/>
  <text x="70" y="41" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#EA580C" text-anchor="middle">750W / 13MM</text>
</svg>
