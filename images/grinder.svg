  <path d="M210 142L250 128L255 148L215 162Z" fill="#EA580C"/>
  <text x="233" y="148" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="900" fill="#FFFFFF" text-anchor="middle">850W</text>

