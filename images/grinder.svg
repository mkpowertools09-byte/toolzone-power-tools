<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Background gradient plate -->
  <rect width="400" height="300" rx="16" fill="#F1F5F9"/>
  <circle cx="200" cy="150" r="110" fill="#E2E8F0" opacity="0.6"/>
  
  <!-- Angle Grinder Disc -->
  <ellipse cx="110" cy="190" rx="55" ry="32" fill="#334155" stroke="#0F172A" stroke-width="3"/>
  <ellipse cx="110" cy="190" rx="42" ry="24" fill="#64748B"/>
  <ellipse cx="110" cy="190" rx="20" ry="12" fill="#EA580C"/>
  <ellipse cx="110" cy="190" rx="9" ry="5" fill="#0F172A"/>

  <!-- Metal Gear Housing -->
  <path d="M110 170L145 150L175 160L160 185L125 190Z" fill="#94A3B8" stroke="#475569" stroke-width="2"/>
  <path d="M140 140L148 110L162 112L155 142Z" fill="#1E293B"/> <!-- Side Handle -->
  <rect x="145" y="95" width="22" height="20" rx="4" fill="#0F172A"/>

  <!-- Motor Body -->
  <path d="M160 160L290 115C296 113 305 116 308 123L318 148C320 154 316 162 309 165L175 205C168 207 160 203 158 197L152 175C150 168 154 162 160 160Z" fill="#0F172A"/>
  
