  <line x1="270" y1="130" x2="274" y2="152" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="278" y1="127" x2="282" y2="149" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="286" y1="124" x2="290" y2="146" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Rear Handle & Power Cord -->
  <path d="M305 130L340 120C348 117 356 122 358 130L360 138C362 145 358 152 350 155L312 165Z" fill="#1E293B"/>
  <path d="M360 138Q380 145 385 170T370 210" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>

  <!-- Badge Overlay -->
